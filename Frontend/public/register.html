<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PTCI Attendance - Register</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/auth.css">
  <link rel="icon" type="image/png" href="images/logo.png">
</head>

<body>
  <div class="card">
    <div class="logo">
      <img src="images/logo.png" alt="PTCI Logo" class="logo-img">
      <div>
        <h1>PTCI</h1>
        <span>Attendance Management</span>
      </div>
    </div>

    <h2>Create account</h2>
    <p class="sub">Create a student account. Teacher/admin accounts are created by an administrator; team leaders are
      assigned to teams.</p>

    <div class="msg" id="msg"></div>

    <form id="regForm">
      <div class="row">
        <div>
          <label>First Name</label>
          <input type="text" id="first" required>
        </div>
        <div>
          <label>Last Name</label>
          <input type="text" id="last" required>
        </div>
      </div>

      <label>Username</label>
      <input type="text" id="username" required>

      <label for="email">Email</label>
      <input type="email" id="email" autocomplete="email">

      <label for="studentNo">Student number</label>
      <input type="text" id="studentNo" maxlength="30" required>

      <label for="department">Department</label>
      <select id="department" required>
        <option value="">Loading departments...</option>
      </select>

      <div class="row">
        <div>
          <label for="yearLevel">Year level</label>
          <select id="yearLevel" required>
            <option value="">Select year</option>
            <option value="1">1st year</option>
            <option value="2">2nd year</option>
            <option value="3">3rd year</option>
            <option value="4">4th year</option>
            <option value="5">5th year</option>
          </select>
        </div>
        <div>
          <label for="section">Section</label>
          <input type="text" id="section" maxlength="20">
        </div>
      </div>

      <label>Password</label>
      <input type="password" id="password" minlength="8" autocomplete="new-password" required>

      <label>Confirm Password</label>
      <input type="password" id="confirm" required>

      <button type="submit">Create Student Account</button>
    </form>

    <div class="footer">
      Already have an account? <a href="index.html">Sign in</a>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>

</html>
